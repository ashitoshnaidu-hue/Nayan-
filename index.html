<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Question 💗</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="floating-hearts" aria-hidden="true"></div>

  <main class="card">
    <p class="eyebrow">A tiny question from Nayan</p>
    <h1>Will you be<br>my special person? 💗</h1>
    <p class="subtitle">You make ordinary days feel a little more magical. So, I wanted to ask you something…</p>

    <div class="scene" aria-label="A teddy bear, flowers, and a heart">
      <span class="teddy">🧸</span>
      <span class="heart">💖</span>
      <span class="bouquet">💐</span>
    </div>

    <p class="question">Will you say yes? 🌷</p>
    <div class="buttons">
      <button id="yesBtn" class="yes-btn">Yes, of course! 💕</button>
      <button id="noBtn" class="no-btn">No 🙈</button>
    </div>
    <p id="message" class="message" aria-live="polite"></p>
    <p class="footer">Made with a little courage & lots of 💗 — Nayan</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
